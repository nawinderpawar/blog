<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d">
  <title id="t">Cache-aware inference request routing</title>
  <desc id="d">A client request reaches the Envoy proxy, which pauses it and asks the llm-d Endpoint Picker which replica to use. The EPP replies with one pod address in a header, and the proxy forwards the request to that replica. Separately and continuously, the EPP scrapes metrics from every replica.</desc>

  <defs>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5fc9d9"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c48ec4"/>
    </marker>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7096"/>
    </marker>
    <style>
      .bx   { fill:#241f33; stroke:#3f3659; stroke-width:1.5; }
      .ttl  { font:600 15px ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif; fill:#ece9f4; }
      .sub  { font:12px ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif; fill:#a79ec0; }
      .mono { font:11.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#a79ec0; }
      .cy   { font:11.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#5fc9d9; }
      .pu   { font:11.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#c48ec4; }
      .dm   { font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#7a7096; }
      .eyeb { font:600 10.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#7a7096; letter-spacing:1.4px; }
      .lc   { stroke:#5fc9d9; stroke-width:2; fill:none; }
      .lp   { stroke:#c48ec4; stroke-width:2; fill:none; }
      .ld   { stroke:#7a7096; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
      .num  { fill:#120f1a; stroke-width:1.5; }
      .numt { font:600 11px ui-sans-serif,-apple-system,Arial,sans-serif; fill:#ece9f4; text-anchor:middle; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#120f1a"/>

  <!-- cluster band -->
  <rect x="186" y="18" width="692" height="440" rx="12" fill="#191527" stroke="#312a46" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="202" y="40" class="eyeb">KUBERNETES CLUSTER</text>

  <!-- client -->
  <rect x="26" y="332" width="126" height="78" rx="9" class="bx"/>
  <text x="89" y="366" class="ttl" text-anchor="middle">Client</text>
  <text x="89" y="385" class="mono" text-anchor="middle">chat + new turn</text>

  <!-- EPP -->
  <rect x="224" y="64" width="222" height="104" rx="9" class="bx" stroke="#8d5f8d"/>
  <text x="240" y="90" class="eyeb" fill="#c48ec4">ENDPOINT PICKER</text>
  <text x="240" y="112" class="ttl">llm-d EPP</text>
  <text x="240" y="134" class="sub">scores every replica,</text>
  <text x="240" y="150" class="sub">names exactly one</text>

  <!-- proxy -->
  <rect x="224" y="305" width="222" height="132" rx="9" class="bx"/>
  <text x="240" y="331" class="eyeb">PROXY</text>
  <text x="240" y="353" class="ttl">Envoy</text>
  <rect x="240" y="367" width="190" height="52" rx="6" fill="#2d2740" stroke="#473c63" stroke-width="1.2"/>
  <text x="250" y="386" class="mono" fill="#c9c2dd">ext_proc filter</text>
  <text x="250" y="405" class="dm">runs before the router</text>

  <!-- replica fleet: staggered cards, front one chosen -->
  <text x="566" y="176" class="eyeb">REPLICA FLEET · ONE INFERENCEPOOL</text>

  <rect x="566" y="196" width="252" height="60" rx="8" class="bx"/>
  <text x="586" y="222" class="sub">vLLM replica</text>
  <text x="586" y="242" class="dm">KV cache: other prefixes</text>

  <rect x="586" y="268" width="252" height="60" rx="8" class="bx"/>
  <text x="606" y="294" class="sub">vLLM replica</text>
  <text x="606" y="314" class="dm">KV cache: other prefixes</text>

  <rect x="606" y="340" width="252" height="62" rx="8" fill="#302543" stroke="#c48ec4" stroke-width="2"/>
  <text x="626" y="366" class="ttl" fill="#f0e6f0">vLLM replica</text>
  <text x="626" y="386" class="pu">holds this conversation’s prefix</text>

  <!-- 1. client -> proxy -->
  <path d="M152 371 L216 371" class="lc" marker-end="url(#aC)"/>
  <circle cx="184" cy="371" r="10" class="num" stroke="#5fc9d9"/>
  <text x="184" y="375" class="numt">1</text>

  <!-- 2. proxy -> EPP (ask) -->
  <path d="M286 305 L286 176" class="lc" marker-end="url(#aC)"/>
  <circle cx="286" cy="236" r="10" class="num" stroke="#5fc9d9"/>
  <text x="286" y="240" class="numt">2</text>
  <text x="268" y="226" class="cy" text-anchor="end">headers + full body</text>
  <text x="268" y="242" class="dm" text-anchor="end">the prompt, over gRPC</text>

  <!-- 3. EPP -> proxy (answer) -->
  <path d="M404 168 L404 297" class="lp" marker-end="url(#aP)"/>
  <circle cx="404" cy="236" r="10" class="num" stroke="#c48ec4"/>
  <text x="404" y="240" class="numt">3</text>
  <text x="422" y="226" class="pu">one pod address</text>
  <text x="422" y="242" class="dm">in a header</text>

  <!-- 4. proxy -> chosen replica -->
  <path d="M446 371 L598 371" class="lc" marker-end="url(#aC)"/>
  <circle cx="512" cy="371" r="10" class="num" stroke="#5fc9d9"/>
  <text x="512" y="375" class="numt">4</text>
  <text x="456" y="358" class="cy">forwarded to that pod</text>

  <!-- 5. EPP scrapes replicas, continuously -->
  <path d="M446 88 L534 88 L534 226 L558 226" class="ld" marker-end="url(#aD)"/>
  <circle cx="534" cy="155" r="10" class="num" stroke="#7a7096"/>
  <text x="534" y="159" class="numt">5</text>
  <text x="548" y="110" class="dm">/metrics on every replica,</text>
  <text x="548" y="125" class="dm">every 50 ms — not per request</text>

  <!-- legend -->
  <g>
    <line x1="28" y1="486" x2="64" y2="486" class="lc"/>
    <text x="72" y="490" class="dm" fill="#8f86ab">request path</text>
    <line x1="186" y1="486" x2="222" y2="486" class="lp"/>
    <text x="230" y="490" class="dm" fill="#8f86ab">routing decision</text>
    <line x1="366" y1="486" x2="402" y2="486" class="ld"/>
    <text x="410" y="490" class="dm" fill="#8f86ab">background telemetry</text>
  </g>
</svg>
