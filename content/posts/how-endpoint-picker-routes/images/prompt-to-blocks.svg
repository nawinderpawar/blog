<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-labelledby="t2 d2">
  <title id="t2">How a prompt becomes block hashes</title>
  <desc id="d2">The prompt's bytes are sliced into groups of four, each group becoming one pseudo-token. Sixty-four pseudo-tokens make one block of 256 bytes. A trailing partial block is kept. Each block hash folds in the previous one, forming a chain.</desc>
  <defs>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fc9d9"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c48ec4"/></marker>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a7096"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07a82"/></marker>
    <style>
      .bx   { fill:#241f33; stroke:#3f3659; stroke-width:1.5; }
      .ttl  { font:600 14.5px ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif; fill:#ece9f4; }
      .sub  { font:12px ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif; fill:#a79ec0; }
      .mono { font:11.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#a79ec0; }
      .cy   { font:11.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#5fc9d9; }
      .pu   { font:11.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#c48ec4; }
      .rd   { font:11.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#e07a82; }
      .dm   { font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#7a7096; }
      .eyeb { font:600 10.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:#7a7096; letter-spacing:1.4px; }
      .lc   { stroke:#5fc9d9; stroke-width:2; fill:none; }
      .lp   { stroke:#c48ec4; stroke-width:2; fill:none; }
      .ld   { stroke:#7a7096; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
      .num  { fill:#120f1a; stroke-width:1.5; }
      .numt { font:600 11px ui-sans-serif,-apple-system,Arial,sans-serif; fill:#ece9f4; text-anchor:middle; }
    </style>
  </defs>
  <rect width="900" height="396" fill="#120f1a"/>

  <text x="28" y="36" class="eyeb">① THE PROMPT, AS BYTES</text>
  <rect x="28" y="52" width="344" height="44" rx="5" class="bx" stroke="#4d9aa6"/>
  <text x="200" y="79" class="cy" text-anchor="middle">bytes 0 – 255</text>
  <rect x="378" y="52" width="344" height="44" rx="5" class="bx" stroke="#4d9aa6"/>
  <text x="550" y="79" class="cy" text-anchor="middle">bytes 256 – 511</text>
  <rect x="728" y="52" width="132" height="44" rx="5" class="bx"/>
  <text x="794" y="79" class="dm" text-anchor="middle">512 – 579</text>

  <text x="28" y="116" class="dm">block 0 — full</text>
  <text x="378" y="116" class="dm">block 1 — full</text>
  <text x="728" y="116" class="dm">block 2 — partial,</text>
  <text x="728" y="131" class="dm">kept anyway</text>

  <text x="28" y="160" class="eyeb">② EVERY 4 BYTES BECOMES ONE PSEUDO-TOKEN</text>
  <g>
    <rect x="28" y="176" width="26" height="30" rx="3" class="bx"/><text x="41" y="196" class="dm" text-anchor="middle">T</text>
    <rect x="57" y="176" width="26" height="30" rx="3" class="bx"/><text x="70" y="196" class="dm" text-anchor="middle">h</text>
    <rect x="86" y="176" width="26" height="30" rx="3" class="bx"/><text x="99" y="196" class="dm" text-anchor="middle">e</text>
    <rect x="115" y="176" width="26" height="30" rx="3" class="bx"/><text x="128" y="196" class="dm" text-anchor="middle">␣</text>
    <rect x="152" y="176" width="26" height="30" rx="3" class="bx"/><text x="165" y="196" class="dm" text-anchor="middle">f</text>
    <rect x="181" y="176" width="26" height="30" rx="3" class="bx"/><text x="194" y="196" class="dm" text-anchor="middle">o</text>
    <rect x="210" y="176" width="26" height="30" rx="3" class="bx"/><text x="223" y="196" class="dm" text-anchor="middle">l</text>
    <rect x="239" y="176" width="26" height="30" rx="3" class="bx"/><text x="252" y="196" class="dm" text-anchor="middle">l</text>
  </g>
  <path d="M84 214 L84 232" class="lc" marker-end="url(#aC)"/>
  <path d="M208 214 L208 232" class="lc" marker-end="url(#aC)"/>
  <rect x="28" y="238" width="112" height="30" rx="5" class="bx" stroke="#4d9aa6"/>
  <text x="84" y="258" class="cy" text-anchor="middle">uint32</text>
  <rect x="152" y="238" width="112" height="30" rx="5" class="bx" stroke="#4d9aa6"/>
  <text x="208" y="258" class="cy" text-anchor="middle">uint32</text>
  <text x="288" y="250" class="sub">…64 of these make one block.</text>
  <text x="288" y="268" class="mono">64 × 4 bytes = 256 bytes</text>
  <text x="620" y="250" class="dm">A tail shorter than 4 bytes is</text>
  <text x="620" y="268" class="dm">zero-padded, so it stays stable.</text>

  <text x="28" y="312" class="eyeb">③ BLOCK HASHES ARE CHAINED</text>
  <rect x="28" y="328" width="150" height="46" rx="6" class="bx" stroke="#8d5f8d"/>
  <text x="103" y="348" class="pu" text-anchor="middle">h₀ = seed</text>
  <text x="103" y="365" class="dm" text-anchor="middle">model + cache_salt</text>
  <path d="M178 351 L206 351" class="lp" marker-end="url(#aP)"/>
  <rect x="212" y="328" width="200" height="46" rx="6" class="bx" stroke="#8d5f8d"/>
  <text x="312" y="354" class="pu" text-anchor="middle">h₁ = H(block₀ , h₀)</text>
  <path d="M412 351 L440 351" class="lp" marker-end="url(#aP)"/>
  <rect x="446" y="328" width="200" height="46" rx="6" class="bx" stroke="#8d5f8d"/>
  <text x="546" y="354" class="pu" text-anchor="middle">h₂ = H(block₁ , h₁)</text>
  <path d="M646 351 L674 351" class="lp" marker-end="url(#aP)"/>
  <rect x="680" y="328" width="200" height="46" rx="6" class="bx" stroke="#8d5f8d"/>
  <text x="780" y="354" class="pu" text-anchor="middle">h₃ = H(block₂ , h₂)</text>

</svg>
